<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101521">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Registo de Jogos</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{color-scheme:dark;--bg:#101521;--surface:#1b2332;--surface2:#263144;--text:#f2f5fb;--muted:#a6b3c8;--line:#354258;--primary:#b4c7ff;--onprimary:#172749;--accent:#81dcc5;--danger:#ffb4ab;--shadow:0 12px 30px #060b1640}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f5fb;--surface:#fff;--surface2:#edf1fa;--text:#202938;--muted:#617087;--line:#dde3ef;--primary:#3759ad;--onprimary:#fff;--accent:#087f68;--danger:#ac302c;--shadow:0 12px 30px #25345415}
*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
header{position:fixed;inset:0 0 auto;z-index:10;min-height:68px;padding:env(safe-area-inset-top) max(16px,calc((100vw - 680px)/2)) 0;background:var(--surface);border-bottom:1px solid var(--line)}.header-inner{height:68px;display:flex;align-items:center;gap:8px;padding:0 12px}.brand{font-size:18px;font-weight:800;letter-spacing:-.5px;flex:1;min-width:0}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}.icon-btn{display:grid;place-items:center;min-width:45px;height:45px;padding:0;border:1px solid var(--line);border-radius:15px;background:var(--surface2);color:var(--text);font-size:21px}
main{max-width:680px;margin:auto;padding:calc(86px + env(safe-area-inset-top)) 16px calc(102px + env(safe-area-inset-bottom))}section{display:none}section.active{display:block}.eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}.heading{font-weight:800;font-size:27px;letter-spacing:-.7px;margin:5px 0 5px}.sub{color:var(--muted);margin:0 0 20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}.center{text-align:center}.muted{color:var(--muted)}.big-score{font-size:clamp(82px,22vw,128px);line-height:1;font-weight:850;letter-spacing:-6px;margin:10px 0}.clock{font-variant-numeric:tabular-nums;font-size:38px;font-weight:750;margin:6px 0}.pill{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:100px;padding:5px 12px;color:var(--muted);font-size:13px}.row{display:flex;gap:10px;align-items:center}.spread{justify-content:space-between}.stack{display:grid;gap:10px}.btn{border:0;min-height:52px;border-radius:16px;padding:12px 16px;background:var(--surface2);color:var(--text);font-weight:750}.btn.primary{background:var(--primary);color:var(--onprimary)}.btn.danger{background:color-mix(in srgb,var(--danger) 15%,var(--surface2));color:var(--danger)}.btn.small{min-height:42px;border-radius:12px;padding:8px 13px;font-size:14px}.btn.full{width:100%}.point-btn{width:100%;min-height:118px;border-radius:26px;font-weight:850;font-size:35px;background:var(--primary);color:var(--onprimary);border:0;box-shadow:var(--shadow)}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat-tile{padding:17px;border-radius:18px;background:var(--surface2)}.stat-num{font-size:31px;font-weight:850;font-variant-numeric:tabular-nums}.stat-label{font-size:12px;color:var(--muted)}.event{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event-info{min-width:0}.event-title{font-weight:720}.event-sub{color:var(--muted);font-size:13px}.tools{display:flex;gap:5px}.tiny-icon{width:40px;height:40px;display:grid;place-items:center;border:0;background:var(--surface2);border-radius:12px;color:var(--text);font-size:17px}.section-title{font-size:19px;font-weight:800;margin:26px 0 12px}.game-list{display:grid;gap:10px}.game-item{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}.game-top{display:flex;justify-content:space-between;gap:8px}.score-box{font-size:30px;font-weight:850;color:var(--accent);font-variant-numeric:tabular-nums}.bar-scroll{overflow-x:auto;padding:10px 0}.chart{display:flex;align-items:end;gap:10px;min-width:100%;height:230px;border-bottom:1px solid var(--line);padding-top:20px}.bar-col{flex:1;min-width:49px;max-width:90px;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:5px}.bar{width:65%;min-height:0;background:var(--primary);border-radius:10px 10px 2px 2px}.bar-num{font-size:12px;font-weight:750}.bar-label{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted);font-weight:650}.field input,.field select{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px;min-height:48px;width:100%}.warning{font-size:13px;color:var(--muted);padding:10px 0}footer{position:fixed;inset:auto 0 0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:11}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:680px;margin:auto}.nav button{background:transparent;color:var(--muted);border:0;border-radius:15px;padding:8px;min-height:56px;font-weight:750}.nav button.active{color:var(--primary);background:var(--surface2)}.nav-icon{display:block;font-size:22px;line-height:1.1}.overlay{position:fixed;inset:0;z-index:40;background:#0009;display:flex;justify-content:center;align-items:center;padding:18px}.dialog{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;width:min(100%,460px);max-height:90vh;overflow:auto;box-shadow:0 25px 65px #0005}.dialog h2{margin:0 0 8px}.dialog-actions{display:flex;gap:10px;margin-top:20px}.dialog-actions .btn{flex:1}.empty{color:var(--muted);text-align:center;padding:22px 10px}.help{font-size:13px;color:var(--muted)}@media(max-width:390px){.brand{font-size:16px}.card{padding:15px}.clock{font-size:31px}}
 .player-heading{text-align:center;font-size:clamp(21px,5vw,26px);margin:11px 0 8px}.game-panel{padding:10px 14px;margin:6px 0 8px}.game-panel .clock{font-size:clamp(26px,7vw,34px);margin:2px 0}.game-panel .big-score{font-size:clamp(60px,17vw,88px);letter-spacing:-3px;margin:3px 0}.game-panel .game-date{font-size:12px}.game-duration{font-size:12px;margin-top:2px}.score-label{font-size:12px}.point-btn{min-height:70px;font-size:25px;border-radius:17px}.game-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}.game-actions .btn{padding:7px 4px;min-height:44px;font-size:12px;border-radius:12px}.points-panel{margin:8px 0;padding:10px 14px}.points-panel .section-title{font-size:15px}.live-points{max-height:clamp(70px,19dvh,160px);overflow-y:auto;overscroll-behavior:contain}.live-points .event{padding:5px 0}.live-points .event-title{font-size:13px}.live-points .event-sub{font-size:11px}body:has(.game-panel) main{padding-top:calc(76px + env(safe-area-inset-top));padding-bottom:calc(76px + env(safe-area-inset-bottom))}body:has(.game-panel) .heading{display:none}body:has(.game-panel) .eyebrow{font-size:11px}body:has(.game-panel) .sub{display:none}body:has(.game-panel) .nav button{min-height:46px;padding:4px}body:has(.game-panel) .nav-icon{font-size:18px}body:has(.game-panel) footer{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}body:has(.game-panel) header .header-inner{height:56px}body:has(.game-panel) header{min-height:56px}body:has(.game-panel) .icon-btn{height:38px;min-width:38px;font-size:17px}body:has(.game-panel) .brand{font-size:15px}body:has(.game-panel) .brand small{font-size:10px}@media(max-height:650px){.game-panel .big-score{font-size:54px}.point-btn{min-height:58px}.game-panel .clock{font-size:25px}.live-points{max-height:85px}.game-panel{padding:7px 10px}}@media(max-width:370px){.header-inner{gap:4px;padding:0 6px}.icon-btn{min-width:38px;height:40px}.brand{font-size:14px}}
 .nav{grid-template-columns:repeat(3,minmax(0,1fr))}.toast{position:fixed;z-index:30;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,440px);border-radius:16px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow)}.toast button{border:0;border-radius:10px;padding:8px 12px;background:var(--primary);color:var(--onprimary);font-weight:750}.config-action{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;margin:8px 0}.config-action span{font-size:14px;color:var(--muted)}.config-action strong{display:block;font-size:16px;color:var(--text)}.season-chip{font-weight:800;color:var(--accent);font-size:13px}.btn{touch-action:manipulation} .point-btn{touch-action:manipulation;user-select:none}body:has(.game-panel) .nav{grid-template-columns:repeat(3,minmax(0,1fr))}

/* Calendário e registo por sets */
.set-picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:9px 0}
.set-picker button{min-width:0;padding:11px 1px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:800;font-size:16px}
.set-picker button.selected{background:var(--primary);color:var(--onprimary,#fff);border-color:var(--primary)}
.set-counts{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.fixture{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.fixture.done{opacity:.83}.fixture .event-sub{margin-top:4px}.fixture strong{font-size:14px}.fixture .fixture-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:6px}.fixture .pill{font-size:11px}
.set-scores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.set-score{text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 1px}.set-score strong{display:block;font-size:22px}
@media(max-width:430px){.game-panel{padding:9px!important}.game-panel .clock{font-size:clamp(25px,8vw,37px)}.game-panel .big-score{font-size:46px}.game-actions{gap:6px}.game-actions .btn{padding:9px 3px;font-size:12px}.point-btn{padding:15px 10px}.heading{font-size:23px}.sub{margin-bottom:9px}nav.nav button{font-size:11px;padding-left:2px;padding-right:2px}}

.fixture-form{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:17px;margin:14px 0 18px;box-shadow:var(--shadow)}
.fixture-form h2{font-size:21px;margin:0 0 8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.form-grid .wide{grid-column:1/-1}.fixture-form .field{min-width:0}.fixture-form input{font:inherit}.fixture-form .form-buttons{display:flex;gap:9px;margin-top:14px}.fixture-form .form-buttons button{flex:1}.fixture.ghost{border-style:dashed;opacity:.82}
@media(max-width:430px){.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}}

/* Compactação mobile e navegação permanente em linha */
.nav,body:has(.game-panel) .nav{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:2px}
.nav button,body:has(.game-panel) .nav button{min-width:0;min-height:53px;padding:5px 1px;font-size:clamp(9px,2.65vw,12px);line-height:1.2;white-space:nowrap}
.nav-icon,body:has(.game-panel) .nav-icon{font-size:19px;margin-bottom:2px}
footer{padding-left:5px;padding-right:5px}
.calendar-controls{display:flex;align-items:center;gap:8px;margin:10px 0}
.calendar-controls label{font-size:13px;font-weight:700;color:var(--muted)}
.calendar-controls select{flex:1;min-width:0;min-height:42px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);font:inherit}
.fixture.nearest{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.game-panel .big-score{font-size:clamp(66px,18vw,105px);margin:5px 0}
.game-panel{padding:12px;margin:7px 0}.point-btn{min-height:92px}.game-actions{grid-template-columns:1fr 1fr}
.set-picker{margin:9px 0 5px}.set-counts{margin:6px 0 13px}
#newView .player-heading{margin:4px 0 2px}
#newView .eyebrow{text-align:center}
@media(max-height:740px){.game-panel .big-score{font-size:60px}.point-btn{min-height:75px}}

/* v1.6 — navegação directa e sets compactos */
.set-picker button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;padding:6px 2px}
.set-picker button small{font-size:10px;font-weight:650;opacity:.8;letter-spacing:.3px}
.set-picker button strong{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.game-panel{padding:8px 12px;margin:6px 0}.game-panel .big-score{font-size:clamp(54px,16vw,84px);margin:3px 0}
.point-btn{min-height:86px}.game-actions{margin:7px 0}
#newView .sub{margin-bottom:7px}
@media(max-height:690px){.set-picker button{min-height:54px}.point-btn{min-height:67px}.game-panel .big-score{font-size:52px}}

.app-version{font-size:10px;color:var(--muted);font-weight:650;letter-spacing:0;white-space:nowrap;vertical-align:middle}.nav{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:2px}.nav button{min-width:0;padding:6px 1px;font-size:clamp(10px,2.7vw,12px);overflow:hidden}.nav-icon{font-size:19px}body:has(.game-panel) .nav{grid-template-columns:repeat(4,minmax(0,1fr))!important}#configView .heading{margin-top:0}.brand{white-space:nowrap}#updateBanner{position:fixed;top:calc(72px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;background:var(--surface2);color:var(--text);border:1px solid var(--accent);padding:10px 12px;width:min(95vw,600px);box-shadow:var(--shadow);border-radius:15px;display:flex;align-items:center;gap:8px;font-size:13px}#updateBanner[hidden]{display:none}#updateBanner button{min-height:36px;padding:6px 10px;border:0;border-radius:10px;background:var(--primary);color:var(--onprimary);font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand">🏐 Registo de Jogos <span class="app-version">v2.0.0</span><small id="headerSub">Voleibol</small></div></div></header>
<main>
<section id="calendarView" class="active"><div class="eyebrow">Cadetes · Todas as épocas</div><div class="row spread"><h1 class="heading">Calendário</h1><button class="btn primary small" id="createFixture" aria-label="Adicionar jogo manual">＋ Novo jogo</button></div><p class="sub">Jogos oficiais e jogos adicionados manualmente</p><div class="calendar-controls"><label for="calendarSeason">Época</label><select id="calendarSeason" aria-label="Época do calendário"></select><button class="btn small" id="nearToday" title="Ir para o próximo jogo">📍 Próximo</button></div><div id="fixtureForm" class="hidden"></div><div id="calendarContent"></div></section>
<section id="newView"><div class="eyebrow" id="seasonLabel"></div><h1 class="heading" id="welcome">Novo jogo</h1><p class="sub" id="newIntro">Regista cada ponto com um toque.</p><div id="newContent"></div></section>
<section id="statsView"><div class="eyebrow">Histórico</div><h1 class="heading">Estatísticas</h1><p class="sub" id="statsSubtitle"></p><div class="field"><label for="seasonFilter">Filtrar por época</label><select id="seasonFilter" aria-label="Filtrar jogos por época"></select></div><div id="statsContent"></div></section>
<section id="configView"><div class="eyebrow">Preferências e dados</div><h1 class="heading">Configuração</h1><div id="configContent"></div></section>
</main>
<footer><nav class="nav" aria-label="Navegação principal"><button id="navCalendar" class="active"><span class="nav-icon">📅</span>Calendário</button><button id="navNew"><span class="nav-icon">➕</span>Novo</button><button id="navStats"><span class="nav-icon">📊</span>Estatísticas</button><button id="navConfig"><span class="nav-icon">⚙️</span>Configuração</button></nav></footer>
<div id="updateBanner" hidden role="status"><span id="updateMessage">Nova versão disponível.</span><button id="updateNow" type="button">Actualizar</button></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><input id="importFile" type="file" accept="application/json,.json" class="hidden"><div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions" class="dialog-actions"></div></div></div>
<script>
(()=>{'use strict';
const APP_VERSION='2.0.0';const KEY='registo-jogos-v1';const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const seasonFor=t=>{let d=new Date(t),y=d.getFullYear();return d.getMonth()>=7?`${y}/${String(y+1).slice(-2)}`:`${y-1}/${String(y).slice(-2)}`};
const fmt=(t,opt={day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})=>new Intl.DateTimeFormat('pt-PT',opt).format(new Date(t));const tm=t=>fmt(t,{hour:'2-digit',minute:'2-digit',second:'2-digit'});const dtLocal=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};const parseDT=s=>{let t=new Date(s).getTime();return Number.isFinite(t)?t:null};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}const fresh=!state||typeof state!=='object';if(fresh)state={player:'',season:seasonFor(Date.now()),seasons:[],games:[],active:null,theme:'dark'};state.games=Array.isArray(state.games)?state.games:[];state.seasons=Array.isArray(state.seasons)?state.seasons:[];state.season=state.season||seasonFor(Date.now());state.theme=state.theme==='light'?'light':'dark';if(!state.seasons.includes(state.season))state.seasons.push(state.season);let view='calendar',editingGameId=null,seasonFilter='all',lastPointAt=0,undoSnapshot=null,toastTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Não foi possível guardar os dados neste dispositivo. Verifica o armazenamento disponível.');return false}}function setTheme(){document.documentElement.dataset.theme=state.theme}function navigate(to){view=to;editingGameId=null;$('newView').classList.toggle('active',to==='new');$('statsView').classList.toggle('active',to==='stats');$('configView').classList.toggle('active',to==='config');$('navNew').classList.toggle('active',to==='new');$('navStats').classList.toggle('active',to==='stats');$('navConfig').classList.toggle('active',to==='config');render();window.scrollTo(0,0)}
function modal(title,body,actions){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').replaceChildren();actions.forEach(a=>{let b=document.createElement('button');b.className=`btn ${a.kind||''}`;b.textContent=a.label;b.onclick=()=>{if(a.fn)a.fn();else closeModal()};$('modalActions').append(b)});$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function confirmBox(title,description,onYes,yesLabel='Confirmar'){modal(title,`<p class="muted">${esc(description)}</p>`,[{label:'Cancelar'},{label:yesLabel,kind:'primary',fn:()=>{closeModal();onYes()}}])}
function playerSetup(){modal('🏐 Nome do jogador','<p class="muted">Que jogador vais acompanhar?</p><div class="field"><label for="playerName">Nome</label><input id="playerName" maxlength="60" autocomplete="name" placeholder="Nome do jogador"></div>',[{label:'Começar',kind:'primary',fn:()=>{const s=$('playerName').value.trim();if(!s){$('playerName').focus();return}state.player=s;save();closeModal();render()}}]);$('playerName').focus()}
function seasonDialog(){let next=state.season.match(/^(\d{4})\/(\d{2})$/)?`${Number(state.season.slice(0,4))+1}/${String(Number(state.season.slice(0,4))+2).slice(-2)}`:seasonFor(Date.now());modal('📅 Nova época',`<p class="muted">Os jogos anteriores ficam guardados e podem continuar a ser consultados.</p><div class="field"><label for="nextSeason">Nova época desportiva</label><input id="nextSeason" type="text" maxlength="7" value="${next}" pattern="[0-9]{4}/[0-9]{2}" placeholder="2027/28"></div><p class="help">Formato: 2026/27</p>`,[{label:'Cancelar'},{label:'Criar época',kind:'primary',fn:()=>{const s=$('nextSeason').value.trim();const m=/^(\d{4})\/(\d{2})$/.exec(s);if(!m||Number(m[2])!==(Number(m[1])+1)%100){alert('Indica uma época válida, como 2026/27.');return}if(state.seasons.includes(s)){alert('Essa época já existe.');return}if(state.active){alert('Termina o jogo em curso antes de mudar de época.');return}confirmBox('Confirmar nova época',`Vais passar a registar jogos na época ${s}. Os jogos anteriores serão preservados.`,()=>{state.seasons.push(s);state.season=s;save();render()},'Mudar época')}}])}
function gameStart(){state.active={id:uid(),season:state.season,start:Date.now(),end:null,points:[],breaks:[],pausedAt:null,status:'playing'};save();render()}

function renderStats(){const allSeasons=[...new Set([...state.seasons,...state.games.map(g=>g.season).filter(Boolean)])].sort((a,b)=>b.localeCompare(a));if(seasonFilter!=='all'&&!allSeasons.includes(seasonFilter))seasonFilter='all';$('seasonFilter').innerHTML='<option value="all">Todas as épocas</option>'+allSeasons.map(s=>`<option value="${esc(s)}" ${seasonFilter===s?'selected':''}>${esc(s)}</option>`).join('');let games=state.games.filter(g=>seasonFilter==='all'||g.season===seasonFilter).sort((a,b)=>b.start-a.start);let total=games.reduce((sum,g)=>sum+g.points.length,0);$('statsSubtitle').textContent=`${state.player} · ${seasonFilter==='all'?'Todas as épocas':'Época '+seasonFilter} · Mais recentes primeiro`;let el=$('statsContent');if(!games.length){el.innerHTML='<div class="card empty">🏐<h3>Ainda não há jogos registados.</h3><p>Inicia um jogo no separador Novo.</p></div>';return}let max=Math.max(1,...games.map(g=>g.points.length));el.innerHTML=`<div class="stat-grid"><div class="stat-tile"><div class="stat-num">${games.length}</div><div class="stat-label">Jogos</div></div><div class="stat-tile"><div class="stat-num">${total}</div><div class="stat-label">Total de pontos</div></div><div class="stat-tile"><div class="stat-num">${(total/games.length).toLocaleString('pt-PT',{maximumFractionDigits:2})}</div><div class="stat-label">Média por jogo</div></div><div class="stat-tile"><div class="stat-num">${max}</div><div class="stat-label">Máximo num jogo</div></div></div><h2 class="section-title">📋 Jogos · mais recentes primeiro</h2><div class="game-list">${games.map(g=>`<div class="game-item"><div class="game-top"><div><div class="event-title">${fmt(g.start,{weekday:'short',day:'2-digit',month:'long',year:'numeric'})}</div><div class="event-sub">Época ${esc(g.season||'—')}</div><div class="event-sub">🕒 ${fmt(g.start,{hour:'2-digit',minute:'2-digit'})} – ${fmt(g.end,{hour:'2-digit',minute:'2-digit'})} · ⏱ ${duration(g)}</div></div><div class="score-box">${g.points.length} let calendarSeason='auto';
function calendarSeasons(){return [...new Set([...state.seasons,...state.fixtures.map(f=>f.season).filter(Boolean),state.season])].sort((a,b)=>a.localeCompare(b))}
function closestFutureFixture(){return [...state.fixtures].filter(f=>Date.parse(f.date)>=Date.now()).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date))[0]||null}
function chooseCalendarSeason(){if(calendarSeason!=='auto')return calendarSeason;const upcoming=closestFutureFixture();return upcoming?.season||[...state.fixtures].sort((a,b)=>Date.parse(b.date)-Date.parse(a.date))[0]?.season||state.season}
function focusCalendarNext(){calendarSeason='auto';renderCalendar();requestAnimationFrame(()=>{const near=document.querySelector('.fixture.nearest');if(near)near.scrollIntoView({block:'center',behavior:'instant'});else window.scrollTo(0,0)})}
function renderCalendar(){
 const season=chooseCalendarSeason(),select=$('calendarSeason');const seasons=calendarSeasons();
 select.innerHTML=seasons.map(y=>`<option value="${esc(y)}" ${y===season?'selected':''}>${esc(y)}</option>`).join('');
 const now=Date.now(),items=[...state.fixtures].filter(f=>f&&f.id&&f.date&&(f.season||seasonFor(Date.parse(f.date)))===season).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
 const nearest=items.find(f=>Date.parse(f.date)>=now)?.id;
 const html=items.map(f=>{const g=forFixture(f.id),past=Date.parse(f.date)<now;
 return `<button class="fixture ${past?'done':''} ${f.id===nearest?'nearest':''}" data-fixture="${esc(f.id)}"><div class="fixture-head"><strong>${esc(f.round||'Jogo')} · ${fmt(f.date,{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</strong><span class="pill">${g?'✅ Registado':past?'○ Sem registo':'📅 Agendado'}</span></div><div>${esc(f.home)} <b>vs</b> ${esc(f.away)}</div><div class="event-sub">📍 ${esc(f.venue||'Local por definir')}${f.source==='manual'?' · ✍️ Manual':''}${g?' · 🏐 '+g.points.length+' pontos':''}</div></button>`}).join('');
 $('calendarContent').innerHTML=`<p class="help">${items.length} jogos · Época ${esc(season)} · Por data</p>${html||'<div class="card empty">Ainda não existem jogos nesta época.</div>'}`;
}

function renderFixtureForm(){
 fixtureFormOpen=true;const seasons=[...new Set([...state.seasons,state.season,...state.fixtures.map(f=>f.season).filter(Boolean)])].sort((a,b)=>b.localeCompare(a));
 const team='Sporting CP';let now=Date.now();
 $('fixtureForm').innerHTML=`<div class="fixture-form"><h2>➕ Adicionar jogo</h2><p class="help">Cria um jogo no calendário, mesmo que não conste do calendário oficial. Os pontos só contam depois de registares o jogo.</p><form id="manualFixtureForm"><div class="form-grid"><div class="field"><label for="mfDate">Data e hora *</label><input id="mfDate" type="datetime-local" required value="${dtLocal(now).slice(0,16)}"></div><div class="field"><label for="mfSeason">Época *</label><select id="mfSeason">${seasons.map(se=>`<option value="${esc(se)}" ${se===state.season?'selected':''}>${esc(se)}</option>`).join('')}</select></div><div class="field wide"><label for="mfHome">Equipa da casa *</label><input id="mfHome" maxlength="100" required value="${team}"></div><div class="field wide"><label for="mfAway">Equipa visitante *</label><input id="mfAway" maxlength="100" required placeholder="Equipa adversária"></div><div class="field"><label for="mfRound">Jornada / tipo</label><input id="mfRound" maxlength="65" placeholder="Ex.: Amigável"></div><div class="field"><label for="mfVenue">Pavilhão / local</label><input id="mfVenue" maxlength="140" placeholder="Local do encontro"></div></div><div class="form-buttons"><button type="button" class="btn" id="cancelFixture">Cancelar</button><button type="submit" class="btn primary">✓ Guardar jogo</button></div></form></div>`;
 $('fixtureForm').classList.remove('hidden');$('mfAway').focus();
}
function createManualFixture(){
 const date=$('mfDate').value,time=parseDT(date),season=$('mfSeason').value,home=$('mfHome').value.trim(),away=$('mfAway').value.trim(),round=$('mfRound').value.trim(),venue=$('mfVenue').value.trim();
 if(time===null||!home||!away||!/^\d{4}\/\d{2}$/.test(season)){alert('Preenche a data, a época e ambas as equipas.');return}
 if(home.toLocaleLowerCase('pt-PT')===away.toLocaleLowerCase('pt-PT')){alert('As equipas da casa e visitante devem ser diferentes.');return}
 const f={id:'manual-'+uid(),date,season,round:round||'Amigável',home,away,venue,source:'manual',createdAt:Date.now()};
 state.fixtures.push(f);if(!state.seasons.includes(season))state.seasons.push(season);
 if(!save()){state.fixtures.pop();return}
 fixtureFormOpen=false;$('fixtureForm').classList.add('hidden');$('fixtureForm').innerHTML='';selectedFixtureId=f.id;gameStart();navigate('new');showToast('Jogo criado. Podes começar a marcar pontos.');
}

function gameStart(){if(state.active){navigate('new');return}const f=fixtureOf(selectedFixtureId);state.active={id:uid(),fixtureId:f?.id||null,season:f?(f.season||seasonFor(new Date(f.date).getTime())):state.season,start:Date.now(),end:null,points:[],breaks:[],pausedAt:null,status:'playing',selectedSet:1};lastPointAt=0;save();render()}
function point(){if(!state.active||state.active.status!=='playing')return;const now=Date.now();if(now-lastPointAt<350)return;lastPointAt=now;state.active.points.push({id:uid(),time:now,set:state.active.selectedSet||1});haptic();if(!save()){state.active.points.pop();return}render()}
function pointRows(g,target,editable=true){return Array.from({length:5},(_,i)=>`<div class="event"><div class="event-info"><div class="event-title">Set ${i+1}</div><div class="event-sub">${pointsInSet(g,i+1)} pontos</div></div>${editable?`<div class="tools"><button class="tiny-icon" data-addset="${i+1}" data-target="${esc(target)}" aria-label="Adicionar ponto ao set ${i+1}">➕</button><button class="tiny-icon" data-minusset="${i+1}" data-target="${esc(target)}" aria-label="Remover ponto do set ${i+1}" ${pointsInSet(g,i+1)?'':'disabled'}>➖</button></div>`:''}</div>`).join('')}
function renderEditor(g,target){let div=document.createElement('div');div.className='card';const f=fixtureOf(g.fixtureId);div.innerHTML=`<div class="eyebrow">${target==='active'?'Revisão final':'Editar jogo'}</div>${f?`<p class="help">${esc(f.round)} · ${esc(f.home)} vs ${esc(f.away)}</p>`:''}<h2 class="heading" style="font-size:23px">${g.points.length} pontos registados</h2><h3 class="section-title">Pontos por set</h3>${pointRows(g,target)}${target==='active'?'<button class="btn primary full" data-action="save-game" style="margin-top:17px">✅ Guardar jogo</button>':'<button class="btn small full" data-action="close-edit" style="margin-top:17px">Fechar edição</button>'}`;if(target==='active')$('newContent').replaceChildren(div);else{const container=$('statsContent');container.prepend(div);div.scrollIntoView({block:'nearest'})}}
function renderNew(){const g=state.active, f=fixtureOf(g?.fixtureId||selectedFixtureId);$('seasonLabel').textContent=`Época ${g?.season||state.season}`;$('welcome').textContent=`Player ${state.player}`;$('newIntro').textContent=f?`${f.round} · ${f.home} vs ${f.away}`:g?'':'Pronto para o próximo jogo?';$('welcome').classList.add('player-heading');let el=$('newContent');if(!g){el.innerHTML=`<div class="card center"><div style="font-size:36px">🏐</div><h2>${f?esc(f.home)+' vs '+esc(f.away):'Preparado?'}</h2>${f?`<p class="help">${fmt(f.date)} · ${esc(f.venue)}</p>`:'<p class="muted">Selecciona um jogo no calendário ou começa um jogo livre.</p>'}<button class="btn primary full" data-action="start">▶️ Iniciar jogo</button></div>`;return}if(g.status==='review'){renderEditor(g,'active');return}let scores=setSummary(g);el.innerHTML=`<div class="card center game-panel"><span class="pill">🏐 ${f?esc(f.round||'Jogo')+' · '+esc(f.home)+' vs '+esc(f.away):'Jogo livre'}</span><div class="big-score">${g.points.length}</div><div class="muted score-label">Total de pontos</div></div><div class="set-picker" role="group" aria-label="Seleccionar set">${[1,2,3,4,5].map(n=>`<button data-set="${n}" class="${(g.selectedSet||1)===n?'selected':''}" aria-pressed="${(g.selectedSet||1)===n}" aria-label="Set ${n}"><small>SET ${n}</small><strong>${scores[n-1]}</strong></button>`).join('')}</div><button class="point-btn" data-action="point">＋ PONTO · SET ${g.selectedSet||1}</button><div class="game-actions"><button class="btn" data-action="undo" ${g.points.length?'':'disabled'}>↶ Anular</button><button class="btn danger" data-action="end">🏁 Terminar</button></div>`}
function renderStats(){
 const seasons=[...new Set([...state.seasons,...state.games.map(g=>g.season),...state.fixtures.map(f=>f.season)].filter(Boolean))].sort((a,b)=>b.localeCompare(a));
 if(seasonFilter!=='all'&&!seasons.includes(seasonFilter))seasonFilter='all';
 $('seasonFilter').innerHTML='<option value="all">Todas as épocas</option>'+seasons.map(y=>`<option ${seasonFilter===y?'selected':''} value="${esc(y)}">${esc(y)}</option>`).join('');
 const matches=g=>seasonFilter==='all'||g.season===seasonFilter;
 let games=state.games.filter(g=>matches(g)&&(!selectedStatsFixtureId||g.fixtureId===selectedStatsFixtureId));
 const savedFixtureIds=new Set(state.games.map(g=>g.fixtureId).filter(Boolean)),now=Date.now();
 const ghosts=state.fixtures.filter(f=>matches(f)&&(!selectedStatsFixtureId||f.id===selectedStatsFixtureId)&&new Date(f.date).getTime()<now&&!savedFixtureIds.has(f.id));
 const entries=[...games.map(g=>({date:fixtureOf(g.fixtureId)?Date.parse(fixtureOf(g.fixtureId).date):g.start,game:g,fixture:fixtureOf(g.fixtureId)})),...ghosts.map(f=>({date:new Date(f.date).getTime(),game:null,fixture:f}))].sort((a,b)=>b.date-a.date);
 const total=games.reduce((a,g)=>a+g.points.length,0),max=Math.max(1,...games.map(g=>g.points.length));
 $('statsSubtitle').textContent=`${state.player} · ${seasonFilter==='all'?'Todas as épocas':seasonFilter} · Mais recentes primeiro`;
 $('statsContent').innerHTML=`${selectedStatsFixtureId?'<button class="btn small" id="clearFixtureFilter">← Ver todos os jogos</button>':''}
 ${!entries.length?'<div class="card empty">🏐<h3>Não existem jogos realizados nesta selecção.</h3></div>':`
 <div class="stat-grid"><div class="stat-tile"><div class="stat-num">${games.length}</div><div class="stat-label">Jogos registados</div></div><div class="stat-tile"><div class="stat-num">${total}</div><div class="stat-label">Pontos</div></div><div class="stat-tile"><div class="stat-num">${games.length?(total/games.length).toLocaleString('pt-PT',{maximumFractionDigits:2}):'—'}</div><div class="stat-label">Média/jogo</div></div><div class="stat-tile"><div class="stat-num">${games.length?Math.max(...games.map(g=>g.points.length)):'—'}</div><div class="stat-label">Máximo</div></div></div>
 <h2 class="section-title">📋 Jogos <span class="muted" style="font-size:13px">(${ghosts.length} sem registo)</span></h2>
 ${entries.map(({date,game:g,fixture:f})=>g?`<div class="game-item"><div class="game-top"><div><div class="event-title">${f?esc(f.home)+' vs '+esc(f.away):fmt(g.start,{day:'2-digit',month:'long',year:'numeric'})}</div><div class="event-sub">${f?esc(f.round)+' · ':''}${f?fmt(f.date,{day:'2-digit',month:'short',year:'numeric'}):fmt(g.start,{day:'2-digit',month:'short',year:'numeric'})} · Época ${esc(g.season)}</div><div class="event-sub">${setSummary(g).map((n,i)=>'S'+(i+1)+': '+n).join(' · ')}</div></div><div class="score-box">${g.points.length} <span style="font-size:12px">pts</span></div></div><div class="row" style="margin-top:12px"><button class="btn small" data-action="edit-game" data-id="${esc(g.id)}">✏️ Editar</button><button class="btn danger small" data-action="remove-game" data-id="${esc(g.id)}">🗑️ Remover</button></div></div>`:
 `<div class="game-item fixture ghost"><div class="game-top"><div><div class="event-title">${esc(f.home)} vs ${esc(f.away)}</div><div class="event-sub">${esc(f.round||'Jogo')} · ${fmt(date)} · Época ${esc(f.season)}</div></div><span class="pill">○ Sem registo</span></div><p class="help">Este jogo não conta para as médias nem para o gráfico.</p><button class="btn small" data-action="record-past" data-id="${esc(f.id)}">＋ Registar jogo</button></div>`).join('')}
 ${games.length?`<h2 class="section-title">📊 Pontos por jogo</h2><div class="card"><div class="bar-scroll"><div class="chart" style="width:${Math.max(100,games.length*68)}%">${games.slice().sort((a,b)=>(Date.parse(fixtureOf(a.fixtureId)?.date)||a.start)-(Date.parse(fixtureOf(b.fixtureId)?.date)||b.start)).map(g=>`<div class="bar-col"><div class="bar-num">${g.points.length}</div><div class="bar" style="height:${g.points.length/max*165}px"></div><div class="bar-label">${fmt(g.start,{day:'2-digit',month:'2-digit'})}</div></div>`).join('')}</div></div></div>`:''}`}`;
 if(editingGameId){const edited=state.games.find(g=>g.id===editingGameId);if(edited)renderEditor(edited,editingGameId)}
}

let selectedStatsFixtureId=null;
function render(){ $('headerSub').textContent=`${state.player||'Voleibol'} · ${state.season}`;renderCalendar();renderNew();renderStats();renderConfig() }
$('calendarSeason').onchange=e=>{calendarSeason=e.target.value;renderCalendar();window.scrollTo(0,0)};$('nearToday').onclick=focusCalendarNext;$('createFixture').onclick=()=>{if(fixtureFormOpen){fixtureFormOpen=false;$('fixtureForm').classList.add('hidden')}else renderFixtureForm()};$('navCalendar').onclick=()=>{navigate('calendar');focusCalendarNext()};$('navNew').onclick=()=>{if(state.active){navigate('new');return}navigate('calendar');renderFixtureForm();window.scrollTo({top:0,behavior:'instant'})};$('navStats').onclick=()=>{selectedStatsFixtureId=null;navigate('stats')};
$('fixtureForm').addEventListener('submit',e=>{if(e.target.id==='manualFixtureForm'){e.preventDefault();createManualFixture()}});$('fixtureForm').addEventListener('click',e=>{if(e.target.closest('#cancelFixture')){fixtureFormOpen=false;$('fixtureForm').classList.add('hidden');$('fixtureForm').innerHTML=''}});document.addEventListener('click',e=>{const fbtn=e.target.closest('[data-fixture]');if(fbtn){let id=fbtn.dataset.fixture,f=fixtureOf(id),existing=forFixture(id);if(existing){selectedStatsFixtureId=id;seasonFilter='all';navigate('stats');editingGameId=existing.id;renderStats();return}if(state.active){alert('Existe um jogo em curso. Conclui-o antes de seleccionar outro.');navigate('new');return}selectedFixtureId=id;gameStart();navigate('new');return}const setbtn=e.target.closest('[data-set]');if(setbtn&&state.active){state.active.selectedSet=Number(setbtn.dataset.set);save();renderNew();return}const plus=e.target.closest('[data-addset]'),minus=e.target.closest('[data-minusset]');if(plus||minus){const btn=plus||minus,g=btn.dataset.target==='active'?state.active:state.games.find(x=>x.id===btn.dataset.target);if(!g)return;const n=Number(btn.dataset.addset||btn.dataset.minusset);if(plus)g.points.push({id:uid(),time:Math.min(g.end||Date.now(),Math.max(g.start,Date.now())),set:n});else{let idx=g.points.map(p=>Number(p.set)||1).lastIndexOf(n);if(idx>=0)g.points.splice(idx,1)}save();render();return}if(e.target.id==='clearFixtureFilter'){selectedStatsFixtureId=null;renderStats()} });

save();setTheme();render();if(state.active){navigate('new')}else requestAnimationFrame(focusCalendarNext);if(!state.player)playerSetup();
// PWA: consultar versões novas, nunca interromper um jogo em curso.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 let registration=null, refreshing=false;
 const banner=document.getElementById('updateBanner'),msg=document.getElementById('updateMessage'),btn=document.getElementById('updateNow');
 const showUpdate=()=>{if(!registration?.waiting)return;banner.hidden=false;const busy=!!state.active;msg.textContent=busy?'Actualização pronta — termina o jogo antes de actualizar.':'Nova versão pronta para instalar.';btn.disabled=busy;btn.textContent=busy?'Jogo em curso':'Actualizar'};
 btn.addEventListener('click',()=>{if(state.active||!registration?.waiting)return;registration.waiting.postMessage({type:'SKIP_WAITING'})});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload()});
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{registration=reg;showUpdate();reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})});const check=()=>{if(navigator.onLine)reg.update().catch(()=>{})};window.addEventListener('focus',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});setInterval(check,60*60*1000);check()}).catch(err=>console.warn('PWA indisponível:',err));
 // Alterações ao jogo actual devem actualizar o banner sem interromper a sessão.
 document.addEventListener('click',()=>{if(!banner.hidden)queueMicrotask(showUpdate)});
}

})();
</script>
</body>
